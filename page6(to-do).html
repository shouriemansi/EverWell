<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
    <link rel="stylesheet" href="css/page6.css">
</head>
<body>
<!-- TOP NAV / BANNER -->
<div class="top-banner">
    <h1>one day at a time ♡</h1>
    <a href="page3(main).html" target="_self" class="main-link">❮</a>
</div>

<!-- MAIN CONTENT -->
<div class="container">

    <!-- HEARTS -->
    <div class="hearts">♡ ♡ ♡</div>

    <!-- TITLE -->
    <h2>Weekly To-do list</h2>

    <!-- ADD TASK -->
    <div class="add-task">
        <input type="text" placeholder="Add new task...">
    </div>

    <!-- WEEKLY SECTION -->
    <div class="week">

        <!-- LEFT IMAGE -->
        <div class="side-image">
            <img src="images/hello-kitty.jpg" alt="pink journal">
        </div>

        <!-- DAYS -->
        <div class="days">

            <!-- MONDAY -->
            <div class="day">
                <h3>Monday</h3>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
            </div>

            <!-- TUESDAY -->
            <div class="day">
                <h3>Tuesday</h3>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
            </div>

            <!-- WEDNESDAY -->
            <div class="day">
                <h3>Wednesday</h3>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
            </div>

            <!-- THURSDAY -->
            <div class="day">
                <h3>Thursday</h3>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
                <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
            </div>

        </div>
    </div>

    <!-- BOTTOM WEEK -->
    <div class="bottom-week">

        <div class="day">
            <h3>Friday</h3>
            <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
            <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
        </div>

        <div class="day">
            <h3>Saturday</h3>
            <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
            <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
        </div>

        <div class="day">
            <h3>Sunday</h3>
            <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
            <label><input type="checkbox"> <input type="text" placeholder="Write here"></label>
        </div>

        <!-- RIGHT IMAGE -->
        <div class="side-image">
            <img src="images/hello-kitty2.jpg" alt="planner">
        </div>

    </div>

</div>
</body>
</html>
